[project]
name = "acme-agent"
version = "0.1.0"
description = "Voice recruiting-interview agent (personal proof of concept)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dateparser>=1.4.3",
    "fastapi>=0.141.1",
    "google-adk>=2.12.0",
    "google-genai>=2.31.0",
    "numpy>=2.5.4",
    "phonenumbers>=9.0.41",
    "pydantic>=2",
    "pydantic-settings>=2.16.0",
    "python-ulid>=4.0.1",
    "rapidfuzz>=3.14.6",
    "structlog>=26.1.0",
    "typer>=0.27.3",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
acme-agent = "acme_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acme_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs", "anton", "raw"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["acme_agent.domain", "acme_agent.domain.*", "acme_agent.interview", "acme_agent.interview.*"]
strict = true

[[tool.mypy.overrides]]
module = ["dateparser", "dateparser.*", "phonenumbers", "phonenumbers.*", "rapidfuzz", "rapidfuzz.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not eval and not live'"
markers = [
    "eval: persona/LLM evaluations that call Vertex AI (excluded by default)",
    "live: tests that need live Google Cloud credentials (excluded by default)",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
    "websockets>=13",
]
mic = ["sounddevice>=0.5"]
