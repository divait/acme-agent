<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Acme Burgers - Talk to Ana</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23e8590c'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="top">
      <span class="logo" aria-hidden="true">AB</span>
      <span class="brand">Acme Burgers</span>
      <span class="demo" id="demo-tag">Demo, fictional company</span>
    </header>

    <main id="main">
      <section id="landing" class="view" aria-labelledby="landing-title">
        <h1 id="landing-title"></h1>
        <p id="landing-intro"></p>
        <p id="landing-privacy" class="note"></p>
        <fieldset class="lang-select">
          <legend id="lang-legend"></legend>
          <div class="segmented">
            <input type="radio" name="interview-lang" id="lang-es" value="es" />
            <label for="lang-es">Español</label>
            <input type="radio" name="interview-lang" id="lang-en" value="en" />
            <label for="lang-en">English</label>
          </div>
        </fieldset>
        <button id="start" class="btn primary" type="button"></button>
      </section>

      <section id="connecting" class="view" hidden aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p id="connecting-text"></p>
      </section>

      <section id="live" class="view wide" hidden>
        <div class="live-grid">
          <div class="stage">
            <h2 id="live-title" class="sr-only"></h2>
            <div class="orb-box">
              <div id="orb" class="orb" data-state="idle" aria-hidden="true"></div>
            </div>
            <p id="orb-status" class="orb-status" aria-live="polite"></p>
            <div class="controls">
              <button id="toggle-convo" class="btn" type="button" aria-expanded="false" aria-controls="convo"></button>
              <button id="toggle-type" class="btn" type="button" aria-expanded="false" aria-controls="text-form"></button>
              <button id="end" class="btn danger" type="button"></button>
            </div>
            <div id="captions-live" class="sr-only" aria-live="polite"></div>
            <div id="convo" class="captions-wrap" hidden>
              <h2 id="captions-title"></h2>
              <div id="captions" class="captions" role="log" aria-live="off" tabindex="0"></div>
            </div>
            <form id="text-form" class="text-form" autocomplete="off" hidden>
              <label class="sr-only" for="text-input" id="text-label"></label>
              <input id="text-input" type="text" maxlength="500" />
              <button class="btn" type="submit" id="text-send"></button>
            </form>
          </div>
          <aside class="profile" aria-labelledby="profile-title">
            <h2 id="profile-title"></h2>
            <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="profile-title" id="progress">
              <div class="bar" id="bar"></div>
            </div>
            <ul id="slots" class="slots"></ul>
          </aside>
        </div>
      </section>

      <section id="processing" class="view" hidden aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p id="processing-text"></p>
      </section>

      <section id="summary" class="view" hidden aria-labelledby="summary-title">
        <h1 id="summary-title"></h1>
        <p id="summary-neutral" class="headline"></p>
        <details class="demo-panel">
          <summary id="demo-label"></summary>
          <p id="complete-line" class="complete"></p>
          <p id="end-reason-row" hidden><strong id="end-reason-label"></strong>: <span id="end-reason"></span></p>
          <h2 id="final-profile-title"></h2>
          <ul id="final-profile" class="final-profile"></ul>
          <p id="tone-row" hidden><strong id="tone-label"></strong>: <span id="tone"></span></p>
          <p id="summary-headline" hidden></p>
          <ul id="summary-points"></ul>
          <h2 id="steps-title"></h2>
          <ul id="summary-steps"></ul>
          <h2 id="questions-title"></h2>
          <ul id="summary-questions"></ul>
        </details>
        <button class="btn primary again" type="button" id="again-summary"></button>
      </section>

      <section id="error" class="view" hidden role="alert" aria-labelledby="error-title">
        <h1 id="error-title"></h1>
        <p id="error-text"></p>
        <button class="btn primary again" type="button" id="again-error"></button>
      </section>
    </main>
  </body>
</html>
